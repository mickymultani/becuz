name: Publish to npm

# Publishes `becuz` via npm OIDC Trusted Publishing -- no tokens or secrets.
#
# One-time setup on npmjs.com (before the first publish):
#   the becuz package -> Settings -> Trusted Publisher -> add a GitHub Actions
#   publisher with:  user/org = mickymultani,  repo = becuz,  workflow = publish.yml
#
# Triggers:
#   1. Push a version tag:        npm version patch && git push --follow-tags
#   2. Publish a GitHub Release   (tag must match package.json version)
#   3. Manually:                  Actions tab -> "Publish to npm" -> Run workflow

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a recent npm (>= 11.5.1).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Verify package version matches the tag
        if: github.event_name != 'workflow_dispatch'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG)" >&2
            exit 1
          fi
      - name: Publish (OIDC; provenance is automatic)
        run: npm publish --access public
